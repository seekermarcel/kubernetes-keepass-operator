name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_NAME: kubernetes-keepass-operator

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Get chart version
        id: chart_version
        run: |
          CHART_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          echo "version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Chart version: ${CHART_VERSION}"

      - name: Update chart version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Extract version from tag (v1.0.0 -> 1.0.0)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Updating chart version to ${TAG_VERSION}"
          
          # Update Chart.yaml version and appVersion
          sed -i "s/^version:.*/version: ${TAG_VERSION}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG_VERSION}\"/" chart/Chart.yaml
          
          # Show updated Chart.yaml
          cat chart/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package chart/ --destination .helm-packages/

      - name: Push Helm chart to OCI registry
        run: |
          cd .helm-packages
          for pkg in *.tgz; do
            echo "Pushing ${pkg} to ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"
            helm push "${pkg}" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
          done

      - name: Push latest tag for main branch
        if: github.ref == 'refs/heads/main'
        run: |
          # For main branch, also tag as latest
          CHART_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          
          # Pull the chart we just pushed
          helm pull oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }} --version ${CHART_VERSION}
          
          # Re-tag and push as 0.0.0-latest (OCI doesn't support 'latest' tag well for Helm)
          # Users can use --devel flag to get this
          echo "Chart pushed with version ${CHART_VERSION}"

      - name: Summary
        run: |
          CHART_VERSION=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          echo "## Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** ${{ env.CHART_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${CHART_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm install kubernetes-keepass-operator oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }} --version ${CHART_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
