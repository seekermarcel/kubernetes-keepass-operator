    controller-gen.kubebuilder.io/version: v0.19.0
  name: keepasssecrets.secrets.keepass.io
spec:
  group: secrets.keepass.io
  names:
    kind: KeePassSecret
    listKind: KeePassSecretList
    plural: keepasssecrets
    singular: keepasssecret
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.generatedSecrets[*].keys
      name: Secrets
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KeePassSecret is the Schema for the keepasssecrets API
          It creates Kubernetes Secrets from encrypted KeePass database files
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KeePassSecret
            properties:
              passwordRef:
                description: passwordRef defines how to obtain the password for decrypting
                  the KeePass database
                properties:
                  secretKey:
                    default: password
                    description: |-
                      secretKey is the key within the Secret that contains the password
                      Defaults to "password" if not specified
                    type: string
                  secretName:
                    description: |-
                      secretName is the name of the Secret containing the password
                      Required when useNamespaceLookup is false
                    type: string
                  useNamespaceLookup:
                    default: false
                    description: |-
                      useNamespaceLookup enables automatic password lookup from domain-passwords.kdbx
                      When true, the operator looks up the password using the namespace name as the entry title
                      The domain-passwords.kdbx file must be mounted in the operator and decrypted using MASTER_PASSWORD env var
                    type: boolean
                type: object
              secretLabels:
                additionalProperties:
                  type: string
                description: secretLabels defines additional labels to apply to generated
                  secrets
                type: object
              sourceRef:
                description: sourceRef references the ConfigMap or Secret containing
                  the .kdbx file
                properties:
                  key:
                    description: key is the key within the ConfigMap/Secret's binaryData
                      that contains the .kdbx file
                    minLength: 1
                    type: string
                  kind:
                    default: ConfigMap
                    description: kind specifies whether the source is a ConfigMap
                      or Secret
                    enum:
                    - ConfigMap
                    - Secret
                    type: string
                  name:
                    description: name is the name of the ConfigMap or Secret containing
                      the .kdbx file
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - kind
                - name
                type: object
              suspend:
                default: false
                description: suspend stops the operator from reconciling this resource
                  when set to true
                type: boolean
              targetSecretName:
                description: |-
                  targetSecretName overrides the default secret name (derived from the source key name)
                  If not specified, the secret name will be derived from the .kdbx filename without extension
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
            required:
            - passwordRef
            - sourceRef
            type: object
          status:
            description: status defines the observed state of KeePassSecret
            properties:
              conditions:
                description: conditions represent the current state of the KeePassSecret
                  resource
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              generatedSecrets:
                description: generatedSecrets contains information about the Kubernetes
                  Secrets created from this resource
                items:
                  description: GeneratedSecretInfo contains information about a generated
                    Kubernetes Secret
                  properties:
                    keys:
                      description: keys is the number of data keys in the Secret
                      type: integer
                    lastUpdated:
                      description: lastUpdated is the timestamp when the Secret was
                        last updated
                      format: date-time
                      type: string
                    name:
                      description: name is the name of the generated Secret
                      type: string
                  required:
                  - keys
                  - name
                  type: object
                type: array
              lastReconcileTime:
                description: lastReconcileTime is the timestamp of the last successful
                  reconciliation
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the last observed generation of
                  the KeePassSecret resource
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
