# This rule is not used by the project kubernetes-keepass-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the secrets.keepass.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-keepass-operator
    app.kubernetes.io/managed-by: kustomize
  name: keepasssecret-editor-role
rules:
- apiGroups:
  - secrets.keepass.io
  resources:
  - keepasssecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - secrets.keepass.io
  resources:
  - keepasssecrets/status
  verbs:
  - get
