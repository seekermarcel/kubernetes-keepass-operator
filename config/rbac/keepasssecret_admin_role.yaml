# This rule is not used by the project kubernetes-keepass-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over secrets.keepass.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-keepass-operator
    app.kubernetes.io/managed-by: kustomize
  name: keepasssecret-admin-role
rules:
- apiGroups:
  - secrets.keepass.io
  resources:
  - keepasssecrets
  verbs:
  - '*'
- apiGroups:
  - secrets.keepass.io
  resources:
  - keepasssecrets/status
  verbs:
  - get
