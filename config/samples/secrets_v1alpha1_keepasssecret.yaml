apiVersion: secrets.keepass.io/v1alpha1
kind: KeePassSecret
metadata:
  labels:
    app.kubernetes.io/name: kubernetes-keepass-operator
    app.kubernetes.io/managed-by: kustomize
  name: keepasssecret-sample
  namespace: default
spec:
  # Reference to the ConfigMap or Secret containing the .kdbx file
  sourceRef:
    kind: ConfigMap
    name: my-keepass-database
    key: secrets.kdbx
  
  # Password configuration
  passwordRef:
    # Option 1: Direct secret reference
    secretName: keepass-password
    secretKey: password
    
    # Option 2: Use namespace-based lookup from domain-passwords.kdbx
    # useNamespaceLookup: true
  
  # Optional: Override the generated secret name
  # targetSecretName: my-app-secrets
  
  # Optional: Additional labels for generated secrets
  secretLabels:
    app.kubernetes.io/managed-by: kubernetes-keepass-operator
